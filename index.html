<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pet Nutrition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f1ea;--panel:#fffdfa;--panel2:#f1e7dc;--line:#e6d8c8;--or:#f28a1e;--ort:#b85c00;--pu:#6a1b9a;--pu2:#8e44ad;--br:#5b3a29;--tx:#34211a;--mut:#7d6554;--bad:#c0392b;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 Nunito,system-ui,sans-serif;min-height:100vh}
h1,h2,h3{font-family:Fredoka,system-ui,sans-serif;margin:0}
h2{margin-bottom:12px;font-size:21px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 1px 2px rgba(91,58,41,.06)}
label{display:grid;gap:4px;font-weight:700;color:var(--mut);font-size:14px}
input,select{background:#fff;border:1.5px solid var(--line);border-radius:10px;color:var(--tx);padding:11px 12px;font:inherit;width:100%}
input:focus,select:focus,button:focus-visible{outline:3px solid #f2b36a;outline-offset:1px}
button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:11px 16px;cursor:pointer;background:var(--or);color:#2a1300}
button.sec{background:#fff;color:var(--br);border:1.5px solid var(--line)}
button.dis{background:var(--pu);color:#fff}
button:disabled{opacity:.4;cursor:not-allowed}
.err{color:var(--bad);font-weight:700;min-height:1.4em;margin:0}
.ok{color:#2e7d4f;font-weight:700;margin:0;min-height:1.4em}
.note{color:var(--mut);font-size:13px;margin:0}
.login{min-height:100vh;display:grid;place-items:center;padding:16px}
.lcard{width:min(780px,100%);display:grid;grid-template-columns:1fr 1fr;border-radius:24px;overflow:hidden;background:var(--panel);box-shadow:0 20px 50px rgba(91,58,41,.18)}
.lbrand{background:linear-gradient(160deg,#6b4431,#46291b);color:#f8eee3;padding:36px 28px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px}
.lbrand h1{font-size:30px}.lbrand p{margin:0;color:#e4cdb9}
.biglogo{width:120px;height:120px}
.loginform{padding:36px 28px;display:grid;gap:12px;align-content:center}
@media(max-width:640px){.lcard{grid-template-columns:1fr}.lbrand{padding:24px}}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);font-size:13px;font-weight:700}
.pill.v1{border-color:var(--or);color:var(--ort)}.pill.v2{border-color:var(--pu2);color:var(--pu)}
.shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
aside{position:sticky;top:0;height:100vh;background:linear-gradient(180deg,#6b4431,#46291b);display:flex;flex-direction:column;padding:18px 12px;gap:18px;color:#f8eee3}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand img{width:46px;height:46px;flex:none}
.brand b{font:700 18px Fredoka,sans-serif;display:block;line-height:1.1}.brand small{color:#e0c7b2;font-size:12px}
aside nav{display:grid;gap:6px}
aside nav button{display:flex;align-items:center;gap:12px;background:transparent;color:#ead8c8;padding:12px 14px;border-radius:12px;text-align:left}
aside nav button svg,.user button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
aside nav button:hover{background:rgba(255,255,255,.1)}
aside nav button.on{background:var(--or);color:#2a1300}
.user{margin-top:auto;display:grid;gap:8px}
.user .pill{background:rgba(255,255,255,.12);border-color:transparent;color:#f8eee3;text-align:center}
.user button{display:flex;align-items:center;gap:10px;justify-content:center;background:transparent;color:#f8eee3;border:1.5px solid rgba(255,255,255,.3)}
.wrap{max-width:1040px;width:100%;padding:26px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.top h1{font-size:26px}.top p{margin:0;color:var(--mut)}
@media(max-width:720px){.shell{grid-template-columns:64px 1fr}aside{padding:10px 6px}.brand div,aside nav button span,.user .pill,.user button span{display:none}.brand img{width:40px;height:40px}.brand{justify-content:center;padding:0}aside nav button{justify-content:center;padding:12px 0}.wrap{padding:14px}}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.form{grid-template-columns:repeat(auto-fit,minmax(200px,1fr));align-items:end}
.stat b{display:block;font:700 26px Fredoka,sans-serif;color:var(--ort)}
.stat span{color:var(--mut);font-size:14px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:700px}
th,td{padding:10px 8px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{color:var(--mut);font-weight:700;font-size:13px}
tbody tr:hover{background:#fbf5ee}
td.n,th.n{text-align:right}
.bar{height:12px;background:var(--panel2);border-radius:99px;overflow:hidden;min-width:120px}
.bar i{display:block;height:100%;background:var(--pu2);border-radius:99px}
.bar.low i{background:var(--or)}
.empty{color:var(--mut);padding:24px;text-align:center}
.low-t{color:var(--ort);font-weight:700}
.ov{position:fixed;inset:0;background:rgba(52,33,26,.55);display:grid;place-items:center;padding:16px;z-index:50;overflow:auto}
.dlg{background:var(--panel);border-radius:20px;width:min(760px,100%);max-height:100%;overflow:auto;box-shadow:0 24px 60px rgba(0,0,0,.3)}
.dh{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line)}
.dh h2{margin:0}.dh .x{padding:6px 12px}
.dpad{padding:20px;display:grid;gap:14px;align-content:start}
table.mini{min-width:460px}
button.add{background:#2e7d4f;color:#fff;margin-left:6px;white-space:nowrap}
td:last-child{white-space:nowrap}
.xdel{padding:11px 14px;color:var(--bad);margin-left:6px;white-space:nowrap}
.xdel:hover{background:#fdecea;border-color:var(--bad)}
tr.prev td{background:#fff3e3}
.dbody>div{padding:20px;display:grid;gap:14px;align-content:start}
.tot{background:#f8efe5;border-left:1px solid var(--line);padding:20px;display:grid;gap:10px;align-content:start}
.info{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0}
.info dt{color:var(--mut);font-weight:700;font-size:14px}.info dd{margin:0;font-weight:600}
.big{font:700 30px Fredoka,sans-serif;color:var(--ort);line-height:1.1}
.tot h3{font-size:16px;color:var(--mut)}
.dl{list-style:none;margin:0;padding:0;display:grid;gap:6px;max-height:200px;overflow:auto}
.dl li{display:flex;justify-content:space-between;gap:8px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:14px}
@media(max-width:640px){.dbody{grid-template-columns:1fr}.tot{border-left:0;border-top:1px solid var(--line)}}
</style>
</head>

let busq='',me=null,tab='registro',items=[],col=null,msg='',filtro='todos';
let users=[],ucol=null,lmode='login',lmsg='',flg='todos';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'S/ '+Number(n||0).toLocaleString('es-PE',{minimumFractionDigits:2,maximumFractionDigits:2});
const hoy=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fmtF=f=>{const[a,m,d]=String(f).split('-');return d?d+'/'+m+'/'+a:f};
const LUGARES=['Ica','Bujama','Callao','Lima','Ancón'];
const vcls=v=>v==='vendedor1'?'v1':'v2';

/* ---- almacenamiento: base compartida si está disponible, si no este navegador ---- */
function loadLocal(){try{items=JSON.parse(localStorage.getItem('pn_items')||'[]')}catch(e){items=[]}try{users=JSON.parse(localStorage.getItem('pn_users')||'[]')}catch(e){users=[]}}
function saveUsersLocal(){try{localStorage.setItem('pn_users',JSON.stringify(users))}catch(e){}}
function saveLocal(){try{localStorage.setItem('pn_items',JSON.stringify(items))}catch(e){}}
async function initStore(){
  try{
    const db=window.claude&&await claude.use('db');
    if(db){col=db.collection('registros');ucol=db.collection('usuarios');
      col.onSnapshot(s=>{items=s.docs.map(d=>({id:d.id,...d.data()}));if(me)render()},()=>{});
      ucol.onSnapshot(s=>{users=s.docs.map(d=>({id:d.id,...d.data()}));if(me==='administrador')render()},()=>{});return}
  }catch(e){}
  loadLocal();render();
}
async function addItem(r){
  if(col){try{await col.add(r);return}catch(e){}}
  r.id='l'+Date.now();items.push(r);saveLocal();
}
async function descontar(id,fecha,n){
  const it=items.find(x=>x.id===id);if(!it||!(n>0)||n>it.cantidad)return false;
  const d={fecha,cant:n,total:Math.round(n*it.costo*100)/100,creado:Date.now()};
  const upd={cantidad:it.cantidad-n,descontado:(it.descontado||0)+n,descuentos:[...(it.descuentos||[]),d]};
  if(col){try{await col.doc(id).update(upd)}catch(e){return false}}
  Object.assign(it,upd);if(!col)saveLocal();return true;
}

const totalQ=r=>(r.inicial??r.cantidad)+(r.agregado||0);
async function ingresar(id,fecha,n){
  const it=items.find(x=>x.id===id);if(!it||!(n>0))return false;
  const upd={cantidad:it.cantidad+n,agregado:(it.agregado||0)+n,ingresos:[...(it.ingresos||[]),{fecha,cant:n,creado:Date.now()}]};
  if(col){try{await col.doc(id).update(upd)}catch(e){return false}}
  Object.assign(it,upd);if(!col)saveLocal();return true;
}
const unombre=x=>{const a=(x.apellidos||'').trim(),n=(x.nombres||'').trim();return a&&n?a+', '+n:(a||n||String(x.nombre||x.nombreCompleto||'').trim()||'(sin nombre)')};
const nom=u=>{const x=users.find(y=>y.dni===u);return x?unombre(x):u};
async function addUser(r){
  if(ucol){try{await ucol.add(r);return true}catch(e){return false}}
  r.id='u'+Date.now();users.push(r);saveUsersLocal();return true;
}
async function autorizar(id){
  const u=users.find(x=>x.id===id);if(!u)return false;
  if(ucol){try{await ucol.doc(id).update({aprobado:true})}catch(e){return false}}
  u.aprobado=true;if(!ucol)saveUsersLocal();return true;
}
async function eliminarUser(id){
  if(ucol){try{await ucol.doc(id).delete()}catch(e){return false}}
  users=users.filter(x=>x.id!==id);if(!ucol)saveUsersLocal();return true;
}
async function eliminar(id){
  if(col){try{await col.doc(id).delete()}catch(e){return false}}
  items=items.filter(x=>x.id!==id);if(!col)saveLocal();return true;
}

/* ---- vistas ---- */
function render(){
  const a=$('#app');
  if(!me){a.innerHTML=loginView();bindLogin();return}
  const admin=me==='administrador';
  const pend=users.filter(u=>!u.aprobado).length;
  const tabs=admin?[['registro','Registro'],['historial','Historial'],['dashboard','Dashboard'],['usuarios','Usuarios'+(pend?' ('+pend+')':'')]]:[['registro','Registro'],['historial','Mi historial']];
  if(!tabs.some(t=>t[0]===tab))tab='registro';
  a.innerHTML=`<div class="shell"><aside><div class="brand"><img src="${LOGO}" alt="Pet Nutrition"><div><b>Pet Nutrition</b><small>Control de stock</small></div></div>
  <nav>${tabs.map(t=>`<button data-t="${t[0]}" class="${tab===t[0]?'on':''}" title="${t[1]}">${ICONS[t[0]]}<span>${t[1]}</span></button>`).join('')}</nav>
  <div class="user"><span class="pill ${admin?'':vcls(me)}">${esc(nom(me))}</span><button class="sec" id="out" title="Cerrar sesión">${ICONS.out}<span>Salir</span></button></div></aside>
  <main class="wrap"><div class="top"><div><h1>${tabs.find(t=>t[0]===tab)[1].replace(/ \(\d+\)$/,'')}</h1><p>Hola, ${esc(nom(me))}</p></div><span class="pill">${new Date().toLocaleDateString('es-PE',{weekday:'long',day:'numeric',month:'long'})}</span></div>
  ${tab==='registro'?(admin?registroAdmin():registroView()):tab==='historial'?historialView(admin):tab==='usuarios'?usuariosView():dashView()}</main></div>`;
  $('#out').onclick=()=>{me=null;msg='';render()};
  document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;msg='';busq='';render()});
  bindMain();
}
function loginView(){
  const brand=`<div class="lbrand"><img class="biglogo" src="${LOGO}" alt="Pet Nutrition"><h1>Pet Nutrition</h1><p>Registro, historial y stock de tus productos.</p></div>`;
  if(lmode==='reg')return`<div class="login"><div class="lcard">${brand}
<form class="loginform" id="rg"><h2>Inscribirse</h2><label>Apellidos<input id="ra" autocomplete="family-name" required></label>
<label>Nombres<input id="rn" autocomplete="given-name" required></label>
<label>DNI<input id="rd" inputmode="numeric" maxlength="8" pattern="[0-9]{8}" placeholder="8 dígitos" required></label>
<p class="err" id="e">${esc(lmsg)}</p><button type="submit">Enviar inscripción</button><button type="button" class="sec" id="back">Volver a ingresar</button></form></div></div>`;
  return`<div class="login"><div class="lcard">${brand}
<form class="loginform" id="lf"><h2>Ingresar</h2><label>Usuario<input id="u" autocomplete="username" autocapitalize="none" required></label>
<label>Clave<input id="p" type="password" autocomplete="current-password" required></label>
<p class="${lmsg[0]==='!'?'err':'ok'}" id="e">${esc(lmsg.replace(/^!/,''))}</p><button type="submit">Ingresar</button><button type="button" class="sec" id="goreg">Inscribirse</button></form></div></div>`}
function bindLogin(){
  const lf=$('#lf');
  if(lf){
    $('#goreg').onclick=()=>{lmode='reg';lmsg='';render()};
    lf.onsubmit=e=>{e.preventDefault();lmsg='';
      const u=$('#u').value.trim().toLowerCase(),p=$('#p').value;
      if(USERS[u]&&USERS[u]===p){me=u;tab='registro';render();return}
      const x=users.find(y=>y.dni&&y.dni===u);
      if(x&&p===x.dni){
        if(x.aprobado){me=x.dni;tab='registro';render();return}
        $('#e').className='err';$('#e').textContent='Tu inscripción aún está pendiente. El administrador debe autorizar tu ingreso.';return;
      }
      $('#e').className='err';$('#e').textContent='Usuario o clave incorrectos. Revisa e intenta de nuevo.';
    };
  }
  const rg=$('#rg');
  if(rg){
    $('#back').onclick=()=>{lmode='login';lmsg='';render()};
    rg.onsubmit=async e=>{e.preventDefault();
      const ap=$('#ra').value.trim().replace(/\s+/g,' '),no=$('#rn').value.trim().replace(/\s+/g,' '),dni=$('#rd').value.trim();
      const er=t=>{$('#e').textContent=t};
      if(!ap||!no)return er('Completa apellidos y nombres.');
      if(!/^\d{8}$/.test(dni))return er('El DNI debe tener 8 dígitos.');
      if(USERS[dni]||users.some(y=>y.dni===dni))return er('Ese DNI ya está inscrito.');
      const ok=await addUser({dni,apellidos:ap,nombres:no,aprobado:false,creado:Date.now()});
      if(!ok)return er('No se pudo enviar la inscripción. Intenta de nuevo.');
      lmode='login';lmsg='Inscripción enviada. Tu usuario y tu clave son tu DNI. El administrador debe autorizar tu ingreso.';render();
    };
  }
}
function usuariosView(){
  const L=users.slice().sort((a,b)=>(a.aprobado?1:0)-(b.aprobado?1:0)||(b.creado||0)-(a.creado||0));
  if(!L.length)return`<div class="card"><h2>Solicitudes de ingreso</h2><div class="empty">Aún no hay personas inscritas.</div></div>`;
  return`<div class="card"><h2>Solicitudes de ingreso</h2><p class="note" style="margin-bottom:12px">Usuario y clave de cada persona: su DNI.</p><div class="scroll"><table><thead><tr><th>Apellidos y nombres</th><th>DNI</th><th>Estado</th><th></th></tr></thead><tbody>
  ${L.map(u=>`<tr><td>${esc(unombre(u))}</td><td>${esc(u.dni||'—')}</td><td><span class="pill ${u.aprobado?'v2':'v1'}">${u.aprobado?'Autorizado':'Pendiente'}</span></td><td>${u.aprobado?'':`<button data-aut="${esc(u.id)}">Autorizar</button> `}<button class="sec" data-udel="${esc(u.id)}" title="Eliminar usuario" aria-label="Eliminar ${esc(unombre(u))}">✕ Eliminar</button></td></tr>`).join('')}</tbody></table></div></div>`;
}
function registroView(){
  return`<div class="card"><h2>Registrar producto</h2>
  <form class="grid form" id="rf">
   <label>Fecha<input type="date" id="f" value="${hoy()}" required></label>
   <label>Lugar<select id="lg" required><option value="">Selecciona un lugar</option>${LUGARES.map(l=>`<option>${l}</option>`).join('')}</select></label>
   <label>Descripción del producto<input id="d" placeholder="Ej. Alimento para perro adulto 15 kg" required></label>
   <label>Costo del producto (S/)<input id="c" type="number" min="0" step="0.01" required></label>
   <label>Cantidad<input id="q" type="number" min="1" step="1" required></label>
   <button type="submit">Guardar en historial</button></form>
   <p class="ok">${esc(msg)}</p></div>`;
}
function registroAdmin(){
  return`<div class="card"><h2>Registro de vendedores</h2>${tabla(items.slice(),true,'ver')}</div>`;
}
function historialView(admin){
  const ok=x=>String(x.descripcion).toLowerCase().includes(busq.trim().toLowerCase())&&(admin&&flg!=='todos'?x.lugar===flg:true);
  const buscador=`<label>Buscar por nombre de producto<input id="bq" type="search" placeholder="Ej. alimento para perro" value="${esc(busq)}" autocomplete="off"></label>`;
  if(!admin){return`<div class="card"><h2>Mi historial</h2><div style="margin-bottom:14px;max-width:420px">${buscador}</div>${tabla(items.filter(x=>x.vendedor===me&&ok(x)),false,'desc')}</div>`}
  const vs=['vendedor1','vendedor2',...users.filter(u=>u.aprobado).map(u=>u.dni)];
  const lista=filtro==='todos'?vs:[filtro];
  return`<div class="card grid form" style="margin-bottom:12px"><label>Ver historial de<select id="flt"><option value="todos">Todos los vendedores</option>${vs.map(v=>`<option value="${esc(v)}" ${filtro===v?'selected':''}>${esc(nom(v))}</option>`).join('')}</select></label><label>Lugar<select id="flg"><option value="todos">Todos los lugares</option>${LUGARES.map(l=>`<option ${flg===l?'selected':''}>${l}</option>`).join('')}</select></label>${buscador}</div>`+
   lista.map(v=>`<div class="card" style="margin-bottom:12px"><h2>Historial de ${esc(nom(v))}</h2>${tabla(items.filter(x=>x.vendedor===v&&ok(x)),false,'ver')}</div>`).join('');
}
const totDesc=r=>r.descuentos?r.descuentos.reduce((s,d)=>s+d.total,0):(r.descontado||0)*r.costo;
function tabla(rows,showV,act){
  rows=rows.sort((a,b)=>String(b.fecha).localeCompare(String(a.fecha))||(b.creado||0)-(a.creado||0));
  if(!rows.length)return`<div class="empty">${busq.trim()?'No hay productos que coincidan con la búsqueda.':'Aún no hay registros. '+(act==='desc'?'Agrega tu primer producto en Registro.':'')}</div>`;
  const del=r=>act==='desc'?` <button class="sec xdel" data-del="${esc(r.id)}" title="Eliminar producto" aria-label="Eliminar ${esc(r.descripcion)}">✕</button>`:'';
  const addb=r=>act==='ver'?` <button class="add" data-open="${esc(r.id)}" data-mode="add">+ Stock</button>`:'';
  const btn=r=>(act==='desc'&&r.cantidad>0?`<button class="dis" data-open="${esc(r.id)}" data-mode="edit">Descontar</button>`:`<button class="sec" data-open="${esc(r.id)}" data-mode="ver">Detalle</button>`)+addb(r)+del(r);
  return`<div class="scroll"><table><thead><tr><th>Fecha</th>${showV?'<th>Vendedor</th>':''}<th>Lugar</th><th>Producto</th><th class="n">Costo</th><th class="n">Cantidad</th><th class="n">Total (costo × cantidad)</th><th class="n">Descontado</th><th class="n">Stock</th><th></th></tr></thead><tbody>
  ${rows.map(r=>`<tr><td>${fmtF(r.fecha)}</td>${showV?`<td><span class="pill ${vcls(r.vendedor)}">${esc(nom(r.vendedor))}</span></td>`:''}<td>${esc(r.lugar||'—')}</td><td>${esc(r.descripcion)}</td><td class="n">${money(r.costo)}</td><td class="n">${totalQ(r)}</td><td class="n">${money(r.costo*totalQ(r))}</td><td class="n">${r.descontado||0}</td><td class="n ${r.cantidad<=5?'low-t':''}"><b>${r.cantidad}</b></td><td>${btn(r)}</td></tr>`).join('')}</tbody></table></div>`;
}
function dashView(){
  const m={};
  items.forEach(r=>{const k=String(r.descripcion).trim().toLowerCase();
    const o=m[k]||(m[k]={nombre:r.descripcion,stock:0,valor:0,vendidos:0,porV:{},porL:{},td:0});
    o.stock+=r.cantidad;o.td+=totDesc(r);o.valor+=r.cantidad*r.costo;o.vendidos+=r.descontado||0;o.porV[r.vendedor]=(o.porV[r.vendedor]||0)+r.cantidad;const lg=r.lugar||'Sin lugar';o.porL[lg]=(o.porL[lg]||0)+r.cantidad});
  const L=Object.values(m).sort((a,b)=>b.stock-a.stock);
  const max=Math.max(1,...L.map(x=>x.stock));
  const tot=L.reduce((s,x)=>s+x.stock,0),val=L.reduce((s,x)=>s+x.valor,0),des=L.reduce((s,x)=>s+x.vendidos,0),td=L.reduce((s,x)=>s+x.td,0);
  const bajos=L.filter(x=>x.stock<=5).length;
  const kCosto=items.reduce((t,r)=>t+(r.costo||0),0),kCant=items.reduce((t,r)=>t+totalQ(r),0),kTot=items.reduce((t,r)=>t+r.costo*totalQ(r),0);
  return`<div class="grid g4" style="margin-bottom:12px">
   <div class="card stat"><b>${money(kCosto)}</b><span>Costo</span></div>
   <div class="card stat"><b>${kCant}</b><span>Cantidad</span></div>
   <div class="card stat"><b>${money(kTot)}</b><span>Total (costo × cantidad)</span></div></div>
  <div class="card"><h2>Stock por producto</h2>${bajos?`<p class="low-t">${bajos} producto(s) con 5 unidades o menos.</p>`:''}
  ${L.length?`<div class="scroll"><table><thead><tr><th>Producto</th><th>Nivel de stock</th><th class="n">Stock</th><th>Por vendedor</th><th>Por lugar</th></tr></thead><tbody>
  ${L.map(x=>`<tr><td>${esc(x.nombre)}</td><td><div class="bar ${x.stock<=5?'low':''}"><i style="width:${Math.max(3,x.stock/max*100)}%"></i></div></td><td class="n ${x.stock<=5?'low-t':''}"><b>${x.stock}</b></td><td>${Object.entries(x.porV).map(([v,q])=>`<span class="pill ${vcls(v)}">${esc(nom(v))}: ${q}</span>`).join(' ')}</td><td>${Object.entries(x.porL).map(([l,q])=>`<span class="pill">${esc(l)}: ${q}</span>`).join(' ')}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Todavía no hay productos registrados.</div>'}
  </div>`;
}
function bindMain(){
  const rf=$('#rf');
  if(rf)rf.onsubmit=async e=>{e.preventDefault();
    const r={vendedor:me,fecha:$('#f').value,lugar:$('#lg').value,descripcion:$('#d').value.trim(),costo:parseFloat($('#c').value),cantidad:parseInt($('#q').value,10),creado:Date.now()};
    r.inicial=r.cantidad;r.descontado=0;
    if(!r.lugar||!r.descripcion||!(r.cantidad>0)||!(r.costo>=0))return;
    await addItem(r);msg='Producto guardado en tu historial.';render();
  };
  const bq=$('#bq');if(bq)bq.oninput=()=>{busq=bq.value;const p=bq.selectionStart;render();const n=$('#bq');n.focus();n.setSelectionRange(p,p)};
  const fg=$('#flg');if(fg)fg.onchange=()=>{flg=fg.value;render()};
  const fl=$('#flt');if(fl)fl.onchange=()=>{filtro=fl.value;render()};
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{
    const r=items.find(x=>x.id===b.dataset.del);if(!r)return;
    if(!confirm('¿Eliminar "'+r.descripcion+'" del historial? Esta acción no se puede deshacer.'))return;
    if(!(await eliminar(r.id)))alert('No se pudo eliminar. Intenta de nuevo.');
    render();
  });
  document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openModal(b.dataset.open,b.dataset.mode));
  document.querySelectorAll('[data-aut]').forEach(b=>b.onclick=async()=>{
    if(!(await autorizar(b.dataset.aut)))alert('No se pudo autorizar. Intenta de nuevo.');render();
  });
  document.querySelectorAll('[data-udel]').forEach(b=>b.onclick=async()=>{
    const u=users.find(x=>x.id===b.dataset.udel);if(!u)return;
    if(!confirm('¿Eliminar a '+unombre(u)+'? Perderá el acceso.'))return;
    if(!(await eliminarUser(u.id)))alert('No se pudo eliminar. Intenta de nuevo.');render();
  });
}
let modalId=null,modalMode='edit',mmsg='';
function openModal(id,mode){if(mode==='add'&&me!=='administrador')return;modalId=id;modalMode=mode;mmsg='';renderModal()}
function closeModal(){modalId=null;$('#modal').innerHTML=''}
function renderModal(){
  const m=$('#modal'),r=items.find(x=>x.id===modalId);
  if(!r){m.innerHTML='';return}
  const edit=modalMode==='edit',add=modalMode==='add',tq=totalQ(r);
  /* kardex: registro inicial + ingresos + descuentos, en orden, con el stock tras cada movimiento */
  const ev=[{t:'Registro inicial',f:r.fecha,c:r.inicial??r.cantidad,k:r.creado||0,o:0}]
    .concat((r.ingresos||[]).map(d=>({t:'Ingreso',f:d.fecha,c:d.cant,k:d.creado||0,o:1})))
    .concat((r.descuentos||[]).map(d=>({t:'Descuento',f:d.fecha,c:-d.cant,k:d.creado||0,o:2})))
    .sort((a,b)=>a.k-b.k||a.o-b.o);
  let run=0;ev.forEach(e=>{run+=e.c;e.s=run});
  const sg=c=>c>0?'+'+c:String(c);
  const row=(f,t,c,s,id,cls)=>`<tr${cls?` class="${cls}"`:''}><td${id?` id="${id}f"`:''}>${fmtF(f)}</td><td>${t}</td><td class="n"${id?` id="${id}c"`:''}>${sg(c)}</td><td class="n ${s<=5?'low-t':''}"${id?` id="${id}s"`:''}><b>${s}</b></td></tr>`;
  const form=add?`<div class="grid form"><label>Fecha del ingreso<input type="date" id="mf" value="${hoy()}"></label>
   <label>Cantidad a agregar<input type="number" id="mq" min="1" step="1" value="1"></label></div>
   <p class="note">La fecha puede ser posterior a hoy.</p><button class="add" style="margin-left:0" id="mok">Confirmar ingreso</button>`
   :r.cantidad>0?`<div class="grid form"><label>Fecha del descuento<input type="date" id="mf" value="${hoy()}"></label>
   <label>Cantidad a descontar<input type="number" id="mq" min="1" max="${r.cantidad}" value="1"></label></div>
   <p class="note">La fecha puede ser posterior a hoy.</p><button class="dis" id="mok">Confirmar descuento</button>`:'<p class="note">Este producto ya no tiene stock.</p>';
  const prev=add?row(hoy(),'Ingreso',1,r.cantidad+1,'pv','prev'):edit&&r.cantidad>0?row(hoy(),'Descuento',-1,r.cantidad-1,'pv','prev'):'';
  const body=ev.map(e=>row(e.f,e.t,e.c,e.s)).join('')+prev;
  m.innerHTML=`<div class="ov" id="ov"><div class="dlg" role="dialog" aria-modal="true" aria-label="Movimientos de stock">
   <div class="dh"><h2>${add?'Agregar stock':edit?'Descontar stock':'Detalle de movimientos'}</h2><button class="sec x" id="cx" aria-label="Cerrar">✕</button></div>
   <div class="dpad"><dl class="info"><dt>Vendedor</dt><dd>${esc(nom(r.vendedor))}</dd><dt>Lugar</dt><dd>${esc(r.lugar||'—')}</dd><dt>Producto</dt><dd>${esc(r.descripcion)}</dd><dt>Costo unitario</dt><dd>${money(r.costo)}</dd><dt>Cantidad</dt><dd>${tq}</dd><dt>Total (costo × cantidad)</dt><dd>${money(r.costo*tq)}</dd><dt>Stock actual</dt><dd class="${r.cantidad<=5?'low-t':''}">${r.cantidad}</dd></dl>
    ${edit||add?form:''}<p class="${mmsg[0]==='!'?'err':'ok'}">${esc(mmsg.replace(/^!/,''))}</p>
    <div class="scroll"><table class="mini"><thead><tr><th>Fecha</th><th>Movimiento</th><th class="n">Cantidad</th><th class="n">Stock</th></tr></thead><tbody>${body}</tbody></table></div>
   </div></div></div>`;
  $('#cx').onclick=closeModal;$('#ov').onclick=e=>{if(e.target.id==='ov')closeModal()};
  const q=$('#mq'),mf=$('#mf');
  if((edit||add)&&q){
    const sgn=add?1:-1;
    /* la fila resaltada se va actualizando mientras escribes */
    const up=()=>{const n=parseInt(q.value,10)||0;
      $('#pvf').textContent=mf.value?fmtF(mf.value):'—';$('#pvc').textContent=sg(sgn*n);
      const st=$('#pvs'),v=r.cantidad+sgn*n;st.innerHTML='<b>'+v+'</b>';st.className='n '+(v<=5?'low-t':'')};
    q.oninput=up;mf.oninput=up;up();q.focus();
    $('#mok').onclick=async()=>{const n=parseInt(q.value,10),f=mf.value;
      if(!f||!(n>0)||(edit&&n>r.cantidad)){mmsg=add?'!Revisa la fecha y la cantidad.':'!Revisa la fecha y que la cantidad no pase del stock.';renderModal();return}
      const ok=await(add?ingresar(r.id,f,n):descontar(r.id,f,n));
      mmsg=ok?(add?'Ingreso guardado.':'Descuento guardado.'):'!No se pudo guardar. Intenta de nuevo.';render();renderModal();};
  }
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modalId)closeModal()});
render();initStore();
</script>
